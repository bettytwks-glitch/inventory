<div class="login-page">
  <div class="login-card">

    <div class="login-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8">
        <rect x="5" y="11" width="14" height="10" rx="2"/>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        <circle cx="12" cy="16" r="1" fill="white" stroke="none"/>
      </svg>
    </div>

    <h1 class="login-title">{{ isForced ? '請修改預設密碼' : '修改密碼' }}</h1>

    <p *ngIf="isForced" class="info-msg">
      您正在使用預設密碼 <strong>123456</strong>，為保護帳號安全，請立即修改。
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <div class="field-wrap">
        <span class="field-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="5" y="11" width="14" height="10" rx="2"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
          </svg>
        </span>
        <input type="password" formControlName="oldPassword" placeholder="目前密碼" autocomplete="current-password">
      </div>

      <div class="field-wrap">
        <span class="field-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 2a5 5 0 0 1 5 5v2H7V7a5 5 0 0 1 5-5z"/>
            <rect x="3" y="9" width="18" height="13" rx="2"/>
            <circle cx="12" cy="15" r="1.5" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <input type="password" formControlName="newPassword" placeholder="新密碼（至少 6 個字元）" autocomplete="new-password">
      </div>

      <div class="field-wrap">
        <span class="field-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 2a5 5 0 0 1 5 5v2H7V7a5 5 0 0 1 5-5z"/>
            <rect x="3" y="9" width="18" height="13" rx="2"/>
            <path d="M9 15l2 2 4-4" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <input type="password" formControlName="confirm" placeholder="確認新密碼" autocomplete="new-password">
      </div>

      <div *ngIf="form.errors?.['mismatch'] && form.get('confirm')?.dirty" class="error-msg">
        兩次密碼輸入不一致
      </div>
      <div *ngIf="errorMsg" class="error-msg">{{ errorMsg }}</div>
      <div *ngIf="successMsg" class="success-msg">{{ successMsg }}</div>

      <button type="submit" class="login-btn" [disabled]="form.invalid || loading">
        {{ loading ? '更新中...' : '確認修改' }}
      </button>

      <div class="forgot-link" *ngIf="isForced">
        <a (click)="logout()" style="cursor:pointer;">登出並重新登入</a>
      </div>

    </form>
  </div>
</div>
