<div class="login-page">
  <div class="login-card">

    <div class="login-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 8v4l3 3"/>
      </svg>
    </div>

    <h1 class="login-title">忘記密碼</h1>
    <p class="sub-text">輸入您的工號，我們將寄送重設連結至您的公司信箱。</p>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <div class="field-wrap">
        <span class="field-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
        </span>
        <input type="text" formControlName="employeeId" placeholder="工號">
      </div>

      <div *ngIf="errorMsg" class="error-msg">{{ errorMsg }}</div>
      <div *ngIf="successMsg" class="success-msg">{{ successMsg }}</div>

      <button type="submit" class="login-btn" [disabled]="form.invalid || loading || !!successMsg">
        {{ loading ? '寄送中...' : '寄送重設連結' }}
      </button>

      <div class="forgot-link">
        <a routerLink="/auth/login">返回登入</a>
      </div>

    </form>
  </div>
</div>
